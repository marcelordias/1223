<div class="flex flex-col items-center min-h-screen bg-base-200">
  <app-navbar class="sticky top-0 z-30 shadow-md w-full mx-auto"></app-navbar>
  
  <main class="flex-grow w-full mx-auto">
    <router-outlet></router-outlet>
  </main> 
  
  <app-footer class="flex-shrink-0 w-full mx-auto"></app-footer>
</div>

<div class="toast toast-top toast-center z-50 p-4 gap-2">
  <app-toast 
    *ngFor="let toast of toasts; let i = index" 
    [message]="toast.message" 
    [type]="toast.type"
    class="animate-slideIn shadow-lg"
  ></app-toast>
</div>
